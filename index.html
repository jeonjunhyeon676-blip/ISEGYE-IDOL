<style>
:root{
  --bg:#1f1f1f; --paper:#ffffff; --ink:#000000; --page:#898989; --strip:#d8d8d8;
  --body:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:var(--body);touch-action:manipulation}
body.light{background:#fff}
img{-webkit-user-drag:none;user-drag:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}

#vp{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);overflow:hidden}
#stage{position:absolute;left:0;top:0;width:2556px;height:1179px;transform-origin:0 0;overflow:hidden;color:#fff}

/* ---------- binder ---------- */
#book{position:absolute;left:0;top:0;width:2556px;height:1179px;perspective:6200px;perspective-origin:1277.5px 614px;touch-action:none;z-index:1}
.box{position:absolute;top:120px;width:1187.5px;height:988px}
#baseL{left:90px;z-index:1} #baseR{left:1277.5px;z-index:1} #closedCover{left:1277.5px;z-index:2}
.side{position:absolute;inset:0}
.panel{position:absolute;inset:0;background:#fff}
.panel.pl{border-radius:62px 0 0 62px} .panel.pr{border-radius:0 62px 62px 0}
.page{position:absolute;background:var(--page)}
.strip{position:absolute;background:var(--strip)}
.dash{position:absolute;left:0;top:0;pointer-events:none}
.cast{position:absolute;top:75px;height:839px;width:300px;pointer-events:none;opacity:0}
.sr .cast{left:57.5px;background:linear-gradient(to right,rgba(0,0,0,.5),rgba(0,0,0,0))}
.sl .cast{right:57.5px;background:linear-gradient(to left,rgba(0,0,0,.5),rgba(0,0,0,0))}
.slot{position:absolute;display:grid;place-items:center}
.slot .card{width:267px}
.slot.filled{cursor:pointer}
.slot.press .card{transform:scale(.965);transition:transform .15s}
.slot.ok::after{content:"";position:absolute;inset:10px;border:4px dashed rgba(255,255,255,.85);border-radius:18px;background:rgba(255,255,255,.14);animation:okp 1.2s ease-in-out infinite alternate}
@keyframes okp{from{opacity:.55}to{opacity:1}}
.slot.dimmed .card{opacity:.4}
.card.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.8);opacity:.2}to{transform:scale(1);opacity:1}}

.leaf{position:absolute;top:120px;width:1187.5px;height:988px;transform-style:preserve-3d;z-index:4}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:calc(var(--sh,0)*.55);background:linear-gradient(to right,rgba(0,0,0,.5),rgba(0,0,0,0) 70%)}
.face.back::after{background:linear-gradient(to left,rgba(0,0,0,.5),rgba(0,0,0,0) 70%)}
.leaf.rev .face::after{background:linear-gradient(to left,rgba(0,0,0,.5),rgba(0,0,0,0) 70%)}
.leaf.rev .face.back::after{background:linear-gradient(to right,rgba(0,0,0,.5),rgba(0,0,0,0) 70%)}

.cfront{position:absolute;inset:0}
.cpanel{position:absolute;left:57.5px;top:0;width:1130px;height:988px;background:#fff;border-radius:0 62px 62px 0}
.stitch{position:absolute;left:120px;top:6px;bottom:0;border-left:2px dashed #666}

#cSpk{position:absolute;left:1830px;top:130px;width:220px;height:165px}
#cSpk::before{content:"";position:absolute;inset:-24px}
#cSpk svg,#cPick svg{display:block;width:100%;height:100%}

/* ---------- popup / sheet / toast ---------- */
#popup{position:absolute;inset:0;z-index:30;display:none;touch-action:none}
#popup.on{display:block}
.pbk{position:absolute;inset:0;background:rgba(0,0,0,0);-webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);transition:background .4s ease,-webkit-backdrop-filter .4s ease,backdrop-filter .4s ease}
#popup.show .pbk{background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(34px) saturate(.85);backdrop-filter:blur(34px) saturate(.85)}
#pwrap{position:absolute;left:891px;top:18px;width:774px;height:1143px;transform-origin:0 0}
#ptilt{position:absolute;inset:0;transform:perspective(1800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out}
#pshadow{position:absolute;left:2%;right:2%;top:2%;bottom:0;border-radius:5.4%/3.64%;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#pflip{position:absolute;inset:0;transform:perspective(1800px) rotateY(0deg)}
.pface{position:absolute;inset:0}
.pface.pb{transform:rotateY(180deg);visibility:hidden}
.pface .frame{filter:hue-rotate(calc((var(--gx,.3) - .5)*26deg))}

#cut{position:absolute;inset:0;z-index:15}
#cutbk{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#cutp{position:absolute;left:358px;top:190px;width:1840px;height:800px;background:#fff;color:#000;border:6px solid #000;border-radius:48px;padding:44px 64px}
.cuth b{display:block;font-size:54px}
.cuth span{display:block;margin-top:6px;font-size:32px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cutTrack{position:relative;width:1500px;height:150px;margin:30px auto 0;background:#efefef;border-radius:20px;overflow:hidden;touch-action:none;cursor:pointer}
#cutTrack canvas{position:absolute;top:0;display:block}
#cutBase{left:0}
#cutWin{position:absolute;top:0;bottom:0;overflow:hidden;background:rgba(0,0,0,.07)}
#cutWin::after{content:"";position:absolute;inset:0;border:6px solid #000;border-radius:20px;pointer-events:none}
#cutAx{display:flex;justify-content:space-between;width:1500px;margin:8px auto 0;font-size:28px;color:#666}
#cutRange{margin-top:6px;text-align:center;font-size:62px;font-weight:700}

<div id="stage">

<script>
(function(){
'use strict';
const META={"card": {"X0": 447, "Y0": 172, "W": 1154, "H": 1704, "frameW": 720, "frameH": 1063, "band": 34, "radius": 62}, "logo": [540, 463, 1502, 883], "sign": {"ine": [562, 1227, 1050, 1446], "jing": [543, 1188, 827, 1445], "lilpa": [555, 1218, 1011, 1460], "jururu": [532, 1223, 1086, 1498], "gosegu": [554, 1241, 1064, 1455], "vlichan": [536, 1231, 1004, 1464]}, "cover": [1482, 202, 2361, 1030]};
const $=(s,r)=>(r||document).querySelector(s);
const div=(c,t)=>{const e=document.createElement('div'); if(c)e.className=c; if(t!=null)e.textContent=t; return e;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const easeIO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const easeOut=k=>1-Math.pow(1-k,3);
const easeSine=k=>-(Math.cos(Math.PI*k)-1)/2;

/* ---------- constants ---------- */
const MEM={
  ine:{name:'아이네',color:'#8a2be2',en:'Ine',nm:[1190,1493]},
  jing:{name:'징버거',color:'#f0a957',en:'JingBurgur',nm:[689,1501]},
  lilpa:{name:'릴파',color:'#343570',en:'Lilpa',nm:[976,1493]},
  jururu:{name:'주르르',color:'#fe008c',en:'Jururu',nm:[816,1506]},
  gosegu:{name:'고세구',color:'#467ec6',en:'Gosegu',nm:[767,1488]},
  vlichan:{name:'비챤',color:'#95c100',en:'Vlichan',nm:[739,1510]}
};
const MEMBERS=['ine','jing','lilpa','jururu','gosegu','vlichan'];
const SECS=[...MEMBERS,'group'];
const SEC_NAME={ine:'아이네',jing:'징버거',lilpa:'릴파',jururu:'주르르',gosegu:'고세구',vlichan:'비챤',group:'단체'};
const TAB_X=[1441,1561,1681,1801,1921,2041,2161,2281];
const TAB_COL=['#d7d7d7',MEM.ine.color,MEM.jing.color,MEM.lilpa.color,MEM.jururu.color,MEM.gosegu.color,MEM.vlichan.color,null];
const CARD=META.card;
const COLS={L:[74,410,730,1057],R:[131.5,459.5,779.5,1114.5]}, ROWS=[75,494,914];
const KEY='ib.state.v1';
const MAX_SEC=60.5;

/* ---------- stage scaling ---------- */
let SC=1;
const stage=$('#stage');
function fit(){
  const vp=$('#vp'), w=vp.clientWidth, h=vp.clientHeight;
  if(!w||!h) return;
  SC=Math.min(w/2556,h/1179);
  const ox=(w-2556*SC)/2, oy=(h-1179*SC)/2;
  stage.style.transform='translate('+ox+'px,'+oy+'px) scale('+SC+')';
}
window.addEventListener('resize',fit); window.addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.visualViewport) window.visualViewport.addEventListener('resize',fit);

let toastT;
function toast(m){const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2400);}

/* ---------- storage layer ---------- */
const DB=(function(){
  let db=null; const mem={cards:new Map(),audio:new Map()};
  function open(){return new Promise(res=>{
    try{
      if(!window.indexedDB){res(false);return;}
      const rq=indexedDB.open('isegye-binder',1);
      rq.onupgradeneeded=()=>{const d=rq.result; if(!d.objectStoreNames.contains('cards'))d.createObjectStore('cards',{keyPath:'id'}); if(!d.objectStoreNames.contains('audio'))d.createObjectStore('audio');};
      rq.onsuccess=()=>{db=rq.result;res(true);};
      rq.onerror=()=>res(false); rq.onblocked=()=>res(false);
    }catch(e){res(false);}
  });}
  return {
    persistent:false,
    async init(){this.persistent=await open(); return this.persistent;},
    allCards(){
      if(!db) return Promise.resolve([...mem.cards.values()]);
      return new Promise((res,rej)=>{const r=db.transaction('cards').objectStore('cards').getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);});
    },
    putCard(rec,audio){
      return new Promise((res,rej)=>{
        if(!db){mem.cards.set(rec.id,rec); if(audio)mem.audio.set(rec.id,audio); res(); return;}
        const t=db.transaction(['cards','audio'],'readwrite');
        t.objectStore('cards').put(rec); if(audio)t.objectStore('audio').put(audio,rec.id);
        t.oncomplete=()=>res(); t.onerror=t.onabort=()=>rej(t.error||new Error('tx'));
      });
    },
    getAudio(id){
      if(!db) return Promise.resolve(mem.audio.get(id)||null);
      return new Promise((res,rej)=>{const r=db.transaction('audio').objectStore('audio').get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error);});
    },
    delCard(id){
      return new Promise(res=>{
        if(!db){mem.cards.delete(id);mem.audio.delete(id);res();return;}
        try{const t=db.transaction(['cards','audio'],'readwrite'); t.objectStore('cards').delete(id); t.objectStore('audio').delete(id); t.oncomplete=()=>res(); t.onerror=t.onabort=()=>res();}catch(e){res();}
      });
    }
  };
})();

let loadFailed=false;
const cards=new Map(); // id -> {id,member,front,url,aud,dur}
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b);});}
let S={storage:[],layout:{}};
function freshLayout(){const l={}; SECS.forEach(s=>{l[s]=[new Array(12).fill(null)];}); return l;}
function loadState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const o=JSON.parse(raw); if(o&&o.layout&&Array.isArray(o.storage)){S=o;}}
  }catch(e){}
  SECS.forEach(s=>{ if(!Array.isArray(S.layout[s])||!S.layout[s].length) S.layout[s]=[new Array(12).fill(null)]; S.layout[s]=S.layout[s].map(sp=>{const a=Array.isArray(sp)?sp.slice(0,12):[]; while(a.length<12)a.push(null); return a;}); });
}
function pruneState(){
  const seen=new Set();
  SECS.forEach(s=>S.layout[s].forEach(sp=>sp.forEach((id,i)=>{ if(id&&(!cards.has(id)||seen.has(id))) sp[i]=null; else if(id) seen.add(id); })));
  S.storage=S.storage.filter(id=>cards.has(id)&&!seen.has(id)&&(seen.add(id),true));
  cards.forEach((c,id)=>{ if(!seen.has(id)){S.storage.push(id);seen.add(id);} });
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

let SPREADS=[], FIRST={};
function computeSpreads(){
  SPREADS=[]; FIRST={};
  SECS.forEach(sec=>{FIRST[sec]=SPREADS.length; S.layout[sec].forEach((_,sp)=>SPREADS.push({sec:sec,sp:sp}));});
}

/* ---------- card elements ---------- */
function pct(b){return {left:((b[0]-CARD.X0)/CARD.W*100).toFixed(3)+'%',top:((b[1]-CARD.Y0)/CARD.H*100).toFixed(3)+'%',width:((b[2]-b[0])/CARD.W*100).toFixed(3)+'%',height:((b[3]-b[1])/CARD.H*100).toFixed(3)+'%'};}
function cardFront(rec,opt){
  const c=div('card front'); const m=MEM[rec.member];
  const ph=div('photo'); ph.style.backgroundImage='url("'+rec.url+'")'; c.appendChild(ph);
  c.appendChild(div('frame')); c.appendChild(div('gloss'));
  if(opt&&opt.sweep) c.appendChild(sweepEl());
  return c;
}
function popupFront(rec){ const c=cardFront(rec,{sweep:true}); c.classList.add('clip'); return c; }
function cardBack(member,opt){
  const m=MEM[member]; const c=div('card back');
  const bg=div('bgc'); bg.style.background=m.color; c.appendChild(bg);
  const lg=div('logo'); const lp=pct(META.logo); Object.assign(lg.style,lp); c.appendChild(lg);
  const sg=div('sign sg-'+member); Object.assign(sg.style,pct(META.sign[member])); c.appendChild(sg);
  const baseY=1665-CARD.Y0, x0=m.nm[0]-CARD.X0-4, len=(m.nm[1]-m.nm[0])+8;
  const wrap=div('nmw'); wrap.style.cssText='position:absolute;inset:0';
  wrap.innerHTML='<svg class="nm" viewBox="0 0 '+CARD.W+' '+CARD.H+'" preserveAspectRatio="none"><text x="'+x0+'" y="'+baseY+'" font-size="194" font-weight="700" font-family="Georgia,\'Times New Roman\',serif" fill="#fff" textLength="'+len+'" lengthAdjust="spacing">'+m.en+'</text></svg>';
  c.appendChild(wrap);
  c.appendChild(div('frame')); c.appendChild(div('gloss'));
  if(opt&&opt.sweep) c.appendChild(sweepEl());
  return c;
}
function warmBacks(){
  const w=div(''); w.style.cssText='position:fixed;left:-4000px;top:0;width:240px;opacity:.01;pointer-events:none';
  MEMBERS.forEach(m=>w.appendChild(cardBack(m))); document.body.appendChild(w);
}
function sweepEl(){const s=div('sweep'); s.appendChild(document.createElement('i')); return s;}

/* ---------- binder sides ---------- */
function dashSvg(side){
  const v=side==='L'?[410,730]:[459.5,779.5];
  const h=side==='L'?[74,1047]:[142.5,1114.5];
  const d=document.createElement('div'); d.className='dash';
  d.innerHTML='<svg width="1187.5" height="988" viewBox="0 0 1187.5 988"><g stroke="#fff" stroke-width="4" stroke-dasharray="14 9" fill="none"><line x1="'+v[0]+'" y1="75" x2="'+v[0]+'" y2="914"/><line x1="'+v[1]+'" y1="75" x2="'+v[1]+'" y2="914"/><line x1="'+h[0]+'" y1="494" x2="'+h[1]+'" y2="494"/></g></svg>';
  return d;
}
function setRect(e,x,y,w,h){e.style.left=x+'px';e.style.top=y+'px';e.style.width=w+'px';e.style.height=h+'px';}
function canPlaceIn(sec,cardId){const c=cards.get(cardId); return !!c&&(sec==='group'||c.member===sec);}
function buildSide(side,flat,opt){
  opt=opt||{};
  const el=div('side '+(side==='L'?'sl':'sr')); const sp=SPREADS[flat];
  if(opt.panel) el.appendChild(div('panel '+(side==='L'?'pl':'pr')));
  const page=div('page'), strip=div('strip');
  if(side==='L'){setRect(page,74,75,983,839); setRect(strip,1057,75,73,839);}
  else{setRect(strip,57.5,75,73,839); setRect(page,131.5,75,983,839);}
  el.appendChild(page); el.appendChild(strip); el.appendChild(dashSvg(side));
  const cols=COLS[side];
  for(let r=0;r<2;r++)for(let c=0;c<3;c++){
    const idx=(side==='L'?0:6)+r*3+c;
    const slot=div('slot'); setRect(slot,cols[c],ROWS[r],cols[c+1]-cols[c],ROWS[r+1]-ROWS[r]);
    slot.dataset.sec=sp.sec; slot.dataset.sp=sp.sp; slot.dataset.idx=idx;
    const id=S.layout[sp.sec][sp.sp][idx];
    if(id&&cards.has(id)){
      slot.classList.add('filled'); slot.dataset.id=id; slot.appendChild(cardFront(cards.get(id)));
      if(placing) slot.classList.add('dimmed');
    }else{
      slot.classList.add('empty');
      if(placing&&canPlaceIn(sp.sec,placing)) slot.classList.add('ok');
    }
    el.appendChild(slot);
  }
  el.appendChild(div('cast'));
  return el;
}
function setBox(box,side,flat){box.innerHTML=''; box.appendChild(buildSide(side,flat,{panel:true}));}
function coverFront(){
  const f=div('cfront'); f.appendChild(div('cpanel')); f.appendChild(div('stitch')); f.appendChild(div('coverart')); return f;
}

/* ---------- app state ---------- */
let state='closed'; // closed | opening | open | closing
let busy=false, cur=0, placing=null, uiLayer=null; // uiLayer: 'storage'|'create'|null
const book=$('#book');

function renderBases(){
  if(state!=='open') return;
  setBox($('#baseL'),'L',cur); setBox($('#baseR'),'R',cur);
  updateTabs(); updateBanner();
}
function curSec(){return SPREADS[cur]?SPREADS[cur].sec:null;}
function updateTabs(forSec){
  const sec=forSec||curSec();
  document.querySelectorAll('.tab').forEach(t=>{
    const i=+t.dataset.i;
    t.classList.toggle('on',state==='open'&&i>=1&&SECS[i-1]===sec);
    const pc=placing&&cards.get(placing);
    t.classList.toggle('hint',!!(pc&&state==='open'&&i>=1&&(SECS[i-1]==='group'||SECS[i-1]===pc.member)));
  });
}
function updateBanner(){
  const b=$('#banner');
  if(placing&&cards.has(placing)&&state==='open'){
    $('#bnText').textContent=SEC_NAME[cards.get(placing).member]+' 카드를 꽂을 칸을 골라 주세요';
    updateTabs();
    b.hidden=false;
  }else{ b.hidden=true; document.querySelectorAll('.tab.hint').forEach(t=>t.classList.remove('hint')); }
}

function anim(from,to,ms,ease,fn){
  return new Promise(res=>{
    if(ms<=0){fn(to);res();return;}
    const t0=performance.now();
    (function f(t){const k=Math.min(1,(t-t0)/ms); fn(from+(to-from)*ease(k)); if(k<1)requestAnimationFrame(f); else res();})(t0);
    // first frame scheduled below
  }).then(()=>{});
}
// robust version using rAF from the start
function animate(from,to,ms,ease,fn){
  return new Promise(res=>{
    if(ms<=0){fn(to);res();return;}
    let t0=null;
    function f(t){ if(t0===null)t0=t; const k=Math.min(1,(t-t0)/ms); fn(from+(to-from)*ease(k)); if(k<1)requestAnimationFrame(f); else res(); }
    requestAnimationFrame(f);
  });
}

/* ---------- page flip ---------- */
function makeFlip(dir){
  const target=cur+dir; if(target<0||target>=SPREADS.length) return null;
  const baseL=$('#baseL'), baseR=$('#baseR');
  const leaf=div('leaf'+(dir<0?' rev':''));
  leaf.style.left=(dir>0?1277.5:90)+'px'; leaf.style.transformOrigin=dir>0?'0 50%':'100% 50%';
  const f=div('face'), b=div('face back');
  if(dir>0){f.appendChild(buildSide('R',cur)); b.appendChild(buildSide('L',target)); setBox(baseR,'R',target);}
  else{f.appendChild(buildSide('L',cur)); b.appendChild(buildSide('R',target)); setBox(baseL,'L',target);}
  leaf.appendChild(f); leaf.appendChild(b);
  book.insertBefore(leaf,$('#rings'));
  const under=dir>0?baseR:baseL, cast=under.querySelector('.cast');
  const o={dir:dir,target:target,leaf:leaf,p:0,
    setP(p){o.p=p; leaf.style.transform='rotateY('+(dir>0?-180*p:180*p).toFixed(2)+'deg)'; leaf.style.setProperty('--sh',Math.sin(Math.PI*p).toFixed(3)); if(cast)cast.style.opacity=(.5*(1-p)).toFixed(3);},
    async finish(commit,ms,ease){
      await animate(o.p,commit?1:0,ms,ease||easeOut,v=>o.setP(v));

}
async function goTo(target){
  if(busy||state!=='open'||target===cur) return;
  busy=true; updateTabs(SPREADS[target]&&SPREADS[target].sec);

    const n=Math.abs(target-cur), dir=target>cur?1:-1;
    const per=n===1?520:clamp(1000/n,105,300);
    while(cur!==target){
      const fl=makeFlip(dir); if(!fl)break;
      await fl.finish(true,per,n===1?easeIO:easeSine);

}

/* ---------- audio ---------- */
const player=new Audio(); player.preload='auto'; player.setAttribute('playsinline','');
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA=';
let actx=null, srcNode=null, gainNode=null, audioURL=null, playToken=0, playing=false, audioBusy=false, needTap=false, pendingAB=null, pendingLoop=true;
const FADE_SEC=2.5;
function applyFadeOut(gn,t0,dur){
  const fade=Math.min(FADE_SEC,dur*0.3); if(!(fade>0.05)) return;
  const N=64, curve=new Float32Array(N); for(let i=0;i<N;i++){ curve[i]=Math.cos(i/(N-1)*Math.PI/2); }
  try{ gn.gain.setValueAtTime(1,t0); gn.gain.setValueCurveAtTime(curve,t0+dur-fade,fade); }catch(_){}
}
function getCtx(){ if(!actx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; actx=new AC(); } return actx; }
function unlockAudio(){
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(_){}
  try{ player.loop=false; player.src=SILENT; const p=player.play(); if(p&&p.catch)p.catch(()=>{}); }catch(_){}
  try{
    const c=getCtx(); if(c){ if(c.state!=='running'&&c.resume) c.resume().catch(()=>{});
      const b=c.createBuffer(1,1,22050), n=c.createBufferSource(); n.buffer=b; n.connect(c.destination); n.start(0); }
  }catch(_){}
}
function stopAudio(){
  playToken++; playing=false; needTap=false; pendingAB=null; audioBusy=false;
  try{player.pause();}catch(_){}
  if(audioURL){ if(audioURL.slice(0,5)==='blob:'){try{URL.revokeObjectURL(audioURL);}catch(_){}} audioURL=null; }
  if(srcNode){ try{srcNode.onended=null; srcNode.stop(0);}catch(_){} try{srcNode.disconnect();}catch(_){} srcNode=null; }
  if(gainNode){ try{gainNode.disconnect();}catch(_){} gainNode=null; }
  try{player.volume=1;}catch(_){}
  updatePreviewBtn();
}
async function toAB(x){
  if(!x) return null;
  if(x instanceof ArrayBuffer) return x;
  if(ArrayBuffer.isView(x)) return x.buffer.slice(x.byteOffset,x.byteOffset+x.byteLength);
  if(typeof x.arrayBuffer==='function'){ try{ return await x.arrayBuffer(); }catch(_){} }
  return await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error||new Error('read')); r.readAsArrayBuffer(x); });
}
function abToB64(ab){ const u=new Uint8Array(ab); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
async function playAB(ab,loop){
  stopAudio(); const tk=playToken; audioBusy=true; const diag=[];
  const fail=(tag,err)=>diag.push(tag+':'+((err&&err.name)||String(err&&err.message||err||'?')));
  // 1) Web Audio (no URLs involved)
  try{
    const c=getCtx(); if(!c) throw new Error('noctx');
    if(c.state!=='running'){ try{ await Promise.race([c.resume(),sleep(600)]); }catch(_){} }
    const buf=await new Promise((res,rej)=>{ const p=c.decodeAudioData(ab.slice(0),res,e=>rej(e||new Error('decode'))); if(p&&p.catch)p.catch(rej); });
    if(tk!==playToken) return;
    const n=c.createBufferSource(); n.buffer=buf; n.loop=loop!==false;
    const gn=c.createGain(); n.connect(gn); gn.connect(c.destination);
    const t0=c.currentTime; if(!n.loop) applyFadeOut(gn,t0,buf.duration);
    n.onended=()=>{ if(tk===playToken){playing=false; updatePreviewBtn();} };
    n.start(t0); srcNode=n; gainNode=gn; playing=true; updatePreviewBtn();
    if(c.state==='running'){ audioBusy=false; return; }
    try{n.onended=null; n.stop(0);}catch(_){} try{gn.disconnect();}catch(_){} srcNode=null; gainNode=null; playing=false; fail('ctx',{name:c.state});
  }catch(err){ if(tk!==playToken) return; fail('wa',err); }
  // 2) <audio> element with a blob URL
  try{
    audioURL=URL.createObjectURL(new Blob([ab],{type:'audio/wav'})); player.loop=loop!==false; player.src=audioURL;
    const p=player.play(); playing=true; updatePreviewBtn(); if(p&&p.then) await p;
    if(tk===playToken) audioBusy=false; return;
  }catch(err){
    if(tk!==playToken) return; playing=false; updatePreviewBtn();
    if(err&&err.name==='NotAllowedError'){ needTap=true; pendingAB=ab; pendingLoop=loop; audioBusy=false; toast('화면을 한 번 눌러 소리를 켜 주세요'); return; }
    if(err&&err.name==='AbortError'){ audioBusy=false; return; }
    fail('el',err);
  }
  // 3) <audio> element with a data URI
  try{
    audioURL='data:audio/wav;base64,'+abToB64(ab); player.loop=loop!==false; player.src=audioURL;
    const p=player.play(); playing=true; updatePreviewBtn(); if(p&&p.then) await p;
    if(tk===playToken) audioBusy=false; return;
  }catch(err){
    if(tk!==playToken) return; playing=false; updatePreviewBtn();
    if(err&&err.name==='NotAllowedError'){ needTap=true; pendingAB=ab; pendingLoop=loop; audioBusy=false; toast('화면을 한 번 눌러 소리를 켜 주세요'); return; }
    fail('uri',err);
  }
  audioBusy=false; toast('소리를 재생하지 못했어요 ('+diag.join(' / ')+')');
}
player.addEventListener('ended',()=>{ if(!player.loop){ playing=false; updatePreviewBtn(); } });
player.addEventListener('timeupdate',()=>{
  try{
    if(player.loop||!isFinite(player.duration)||player.duration<=0){ player.volume=1; return; }
    const fade=Math.min(FADE_SEC,player.duration*0.3), rem=player.duration-player.currentTime;
    player.volume=(rem<fade)?Math.max(0,Math.cos((1-rem/fade)*Math.PI/2)):1;
  }catch(_){}
});
function kickAudio(){
  if(needTap&&pendingAB){ const b=pendingAB, l=pendingLoop; needTap=false; pendingAB=null; unlockAudio(); playAB(b,l); return; }
  if(!playing&&!audioBusy) unlockAudio();
}

function wavBuffer(f32,sr){
  const n=f32.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
  let o=44; for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,f32[i])); v.setInt16(o,s<0?s*32768:s*32767,true); o+=2;}
  return buf;
}
function videoDuration(file){
  return new Promise((res,rej)=>{
    const v=document.createElement('video'); v.preload='metadata'; v.muted=true; v.setAttribute('playsinline','');
    const url=URL.createObjectURL(file);
    const done=()=>{try{URL.revokeObjectURL(url);}catch(_){} v.removeAttribute('src');};
    v.onloadedmetadata=()=>{const d=v.duration; done(); res(d);};
    v.onerror=()=>{done(); rej(new Error('meta'));};
    v.src=url; setTimeout(()=>{ if(!isFinite(v.duration)){done(); rej(new Error('timeout'));} },4000);
  });
}
function mkErr(code,orig){ const e=new Error(code); e.code=code; e.detail=(orig&&(orig.name||orig.message))||''; return e; }
function decodeAB(ctx,ab){ return new Promise((res,rej)=>{ const p=ctx.decodeAudioData(ab,res,e=>rej(e||new Error('decode'))); if(p&&p.catch)p.catch(rej); }); }
async function decodeFile(file,isVideo){
  if(isVideo){
    let d=NaN; try{d=await videoDuration(file);}catch(_){}
    if(isFinite(d)&&d>MAX_SEC) throw mkErr('long');
    if(file.size>350*1024*1024) throw mkErr('big');
  }else if(file.size>120*1024*1024) throw mkErr('big');
  let ab; try{ ab=await toAB(file); }catch(err){ throw mkErr('read',err); }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) throw mkErr('noaudio');
  let ctx; try{ ctx=new AC({sampleRate:32000}); }catch(_){ ctx=new AC(); }
  let dec;
  try{ dec=await decodeAB(ctx,ab); }
  catch(err){ try{ctx.close();}catch(_){} throw mkErr('decode',err); }
  try{ctx.close();}catch(_){}
  if(!dec||!dec.length) throw mkErr('decode',{name:'empty'});
  return dec;
}
async function renderSegment(dec,start,len){
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const sr=32000, n=Math.max(1,Math.ceil(len*sr));
  const i0=Math.max(0,Math.floor(start*dec.sampleRate)), cnt=Math.max(1,Math.min(Math.floor(len*dec.sampleRate),dec.length-i0));
  let out;
  try{
    const oc=new OAC(1,n,sr), sub=oc.createBuffer(dec.numberOfChannels,cnt,dec.sampleRate);
    for(let c=0;c<dec.numberOfChannels;c++) sub.getChannelData(c).set(dec.getChannelData(c).subarray(i0,i0+cnt));
    const src=oc.createBufferSource(); src.buffer=sub; src.connect(oc.destination); src.start(0);
    out=await new Promise((res,rej)=>{const p=oc.startRendering(); if(p&&p.then)p.then(res,rej); else oc.oncomplete=ev=>res(ev.renderedBuffer);});
  }catch(err){ throw mkErr('render',err); }
  const ch=out.getChannelData(0), fade=Math.min(Math.floor(sr*.012),Math.floor(ch.length/4));
  for(let i=0;i<fade;i++){ const k=i/fade; ch[i]*=k; ch[ch.length-1-i]*=k; }
  let pk=0; for(let i=0;i<ch.length;i++){const v=Math.abs(ch[i]); if(v>pk)pk=v;}
  if(pk<0.0005) throw mkErr('quiet');
  return {ab:wavBuffer(ch,sr),dur:cnt/dec.sampleRate};
}
async function extractAudio(file){
  const dec=await decodeFile(file,true);
  if(dec.duration>MAX_SEC) throw mkErr('long');
  return renderSegment(dec,0,dec.duration);
}
function importFail(err,kind){
  const d=err&&err.detail?(' · '+err.detail):'', c=err&&err.code;
  if(c==='long') toast('1분 이하의 영상만 쓸 수 있어요');
  else if(c==='big') toast('파일 용량이 너무 커요');
  else if(c==='quiet') toast('소리가 거의 들리지 않는 '+(kind==='video'?'영상':'파일')+'이에요');
  else if(c==='decode') toast(kind==='video'?'이 영상에서 소리를 읽지 못했어요. 소리가 없거나 읽을 수 없는 형식일 수 있어요 (decode'+d+')':'이 파일의 소리를 읽지 못했어요. mp3나 m4a 파일을 써 보세요 (decode'+d+')');
  else toast('소리를 가져오지 못했어요 ('+(c||'error')+d+')');
}

/* 1-minute segment picker (for long music files) */
let cutState=null, cutDrag=false;
function wavePeaks(dec,bins){
  const d=dec.getChannelData(0), per=Math.max(1,Math.floor(d.length/bins)), out=new Float32Array(bins); let mx=1e-6;
  for(let i=0;i<bins;i++){ let m=0; const s0=i*per, s1=Math.min(d.length,s0+per); for(let j=s0;j<s1;j+=2){const v=Math.abs(d[j]); if(v>m)m=v;} out[i]=m; if(m>mx)mx=m; }
  for(let i=0;i<bins;i++) out[i]/=mx; return out;
}
function drawWave(cv,peaks,color){
  const x=cv.getContext('2d'), w=cv.width, h=cv.height; x.clearRect(0,0,w,h); x.fillStyle=color;
  for(let i=0;i<w;i++){ const bh=Math.max(4,peaks[Math.min(peaks.length-1,Math.floor(i*peaks.length/w))]*(h-24)); x.fillRect(i,(h-bh)/2,1,bh); }
}
function fmtTf(s){s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function setCutStart(t){
  if(!cutState) return;
  cutState.start=clamp(t,0,Math.max(0,cutState.total-cutState.win));
  const W=1500, left=cutState.start/cutState.total*W, wd=cutState.win/cutState.total*W;
  const win=$('#cutWin'); win.style.left=left+'px'; win.style.width=wd+'px'; $('#cutHi').style.left=(-left)+'px';
  $('#cutRange').innerHTML=fmtTf(cutState.start)+' ~ '+fmtTf(cutState.start+cutState.win)+'<small>('+fmtTf(cutState.win)+')</small>';
}
function stopCutPlay(){
  if(cutState&&cutState.node){ try{cutState.node.onended=null; cutState.node.stop(0);}catch(_){} try{cutState.node.disconnect();}catch(_){} cutState.node=null; }
  if(cutState&&cutState.gain){ try{cutState.gain.disconnect();}catch(_){} cutState.gain=null; }
  $('#cutPlay').textContent='▶ 미리듣기';
}
function openCut(dec,name){
  const win=Math.min(MAX_SEC,dec.duration);
  cutState={dec:dec,total:dec.duration,win:Math.min(60,win),start:0,node:null,name:name};
  $('#cutName').textContent=name+' · 전체 '+fmtTf(dec.duration);
  $('#cutTot').textContent=fmtTf(dec.duration);
  const pk=wavePeaks(dec,750); drawWave($('#cutBase'),pk,'#b5b5b5'); drawWave($('#cutHi'),pk,'#000');
  $('#cut').hidden=false; setCutStart(0);
}
function closeCut(){ stopCutPlay(); $('#cut').hidden=true; cutState=null; cutDrag=false; }
async function cutPlay(){
  if(!cutState) return;
  if(cutState.node){ stopCutPlay(); return; }
  unlockAudio(); stopAudio();
  const c=getCtx(); if(!c){ toast('이 브라우저에서는 미리듣기를 할 수 없어요'); return; }
  if(c.state!=='running'){ try{ await Promise.race([c.resume(),sleep(600)]); }catch(_){} }
  if(!cutState) return;
  try{
    const n=c.createBufferSource(); n.buffer=cutState.dec; const gn=c.createGain(); n.connect(gn); gn.connect(c.destination);
    const t0=c.currentTime; applyFadeOut(gn,t0,cutState.win);
    n.onended=()=>{ if(cutState&&cutState.node===n){ cutState.node=null; $('#cutPlay').textContent='▶ 미리듣기'; } };
    n.start(t0,cutState.start,cutState.win); cutState.node=n; cutState.gain=gn; $('#cutPlay').textContent='■ 멈추기';
  }catch(err){ toast('미리듣기를 할 수 없어요 ('+((err&&err.name)||'오류')+')'); }
}
function cutMove(e){
  if(!cutState) return; const tr=$('#cutTrack'), r=tr.getBoundingClientRect(); if(!r.width) return;
  setCutStart((e.clientX-r.left)/r.width*cutState.total-cutState.win/2);
}
$('#cutTrack').addEventListener('pointerdown',e=>{ if(!cutState) return; cutDrag=true; stopCutPlay(); try{$('#cutTrack').setPointerCapture(e.pointerId);}catch(_){} cutMove(e); });

/* photo pan / pinch */
const ptrs=new Map(); let g0=null;
function startG(){
  const a=[...ptrs.values()];
  if(a.length===1) g0={n:1,x:a[0].x,y:a[0].y,cx:cr.cx,cy:cr.cy};
  else if(a.length>=2){const p=a[0],q=a[1]; g0={n:2,d:Math.hypot(p.x-q.x,p.y-q.y)||1,s:cr.s,cx:cr.cx,cy:cr.cy,mx:(p.x+q.x)/2,my:(p.y+q.y)/2};}
  else g0=null;
}
win.addEventListener('pointerdown',e=>{ if(!cr.img) return; try{win.setPointerCapture(e.pointerId);}catch(_){} ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); startG(); });

  if(!ptrs.has(e.pointerId)||!g0) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const a=[...ptrs.values()];
  if(g0.n===1&&a.length===1){ cr.cx=g0.cx+(a[0].x-g0.x)/SC; cr.cy=g0.cy+(a[0].y-g0.y)/SC; }
  else if(g0.n===2&&a.length>=2){
    const p=a[0],q=a[1], d=Math.hypot(p.x-q.x,p.y-q.y)||1, mx=(p.x+q.x)/2, my=(p.y+q.y)/2;
    const s=clamp(g0.s*d/g0.d,cr.smin,cr.smin*8), r=win.getBoundingClientRect(), cX=r.left+r.width/2, cY=r.top+r.height/2;
    const m0x=(g0.mx-cX)/SC, m0y=(g0.my-cY)/SC, m1x=(mx-cX)/SC, m1y=(my-cY)/SC, k=s/g0.s;
    cr.s=s; cr.cx=m1x-(m0x-g0.cx)*k; cr.cy=m1y-(m0y-g0.cy)*k;
  }
  applyPhoto();
});
['pointerup','pointercancel'].forEach(t=>win.addEventListener(t,e=>{ptrs.delete(e.pointerId); startG();}));
win.addEventListener('wheel',e=>{ if(!cr.img) return; e.preventDefault(); const k=Math.exp(-e.deltaY*.0015); cr.s=clamp(cr.s*k,cr.smin,cr.smin*8); applyPhoto(); },{passive:false});
function bake(){
  return new Promise((res,rej)=>{
    const WW=win.clientWidth, WH=win.clientHeight, OW=800, OH=Math.round(800*WH/WW), k=OW/WW;
    const cv=document.createElement('canvas'); cv.width=OW; cv.height=OH; const x=cv.getContext('2d');

  });
}

function openPopup(id,srcEl){
  const rec=cards.get(id); if(!rec||pop) return;
  const P=$('#popup'), wrap=$('#pwrap');
  $('#pfront').innerHTML=''; $('#pback').innerHTML='';
  $('#pfront').appendChild(popupFront(rec)); $('#pback').appendChild(cardBack(rec.member,{sweep:true}));
  flipping=false; setFlipAngle(0); setLight(.3,.18);
  P.classList.remove('show'); P.classList.add('on'); void P.offsetWidth; P.classList.add('show');
  pop={id:id,src:srcEl,flipped:false,t0:performance.now(),closing:false};
  const ph=$('#pfront .photo'); if(ph) ph.animate([{transform:'scale(1.075)'},{transform:'scale(1)'}],{duration:1000,easing:'cubic-bezier(.2,.7,.2,1)'});
  if(srcEl&&srcEl.isConnected){
    const a=stageRectOf(srcEl), fx=891, fy=18, fw=774, fh=1143;
    wrap.animate([{transform:'translate('+(a.x-fx)+'px,'+(a.y-fy)+'px) scale('+(a.w/fw)+','+(a.h/fh)+')'},{transform:'none'}],{duration:420,easing:'cubic-bezier(.2,.85,.25,1)'});
  }else wrap.animate([{transform:'scale(.85)',opacity:0},{transform:'none',opacity:1}],{duration:300,easing:'ease-out'});
  if(rec.aud){
    DB.getAudio(id).then(async x=>{
      if(!pop||pop.id!==id||pop.closing) return;
      if(!x){ toast('이 카드에 저장된 소리를 찾지 못했어요'); return; }
      let ab=null; try{ ab=await toAB(x); }catch(err){ toast('저장된 소리를 읽지 못했어요 ('+((err&&err.name)||'오류')+') · 카드를 새로 만들어 주세요'); return; }
      if(pop&&pop.id===id&&!pop.closing&&ab) playAB(ab,false);
    }).catch(err=>{ toast('저장된 소리를 불러오지 못했어요 ('+((err&&err.name)||'오류')+')'); });
  }
  startMotion();
}
async function closePopup(){
  if(!pop||pop.closing) return; pop.closing=true; stopAudio(); g=null;
  const wrap=$('#pwrap'), src=pop.src, P=$('#popup');
  let a=null; if(src&&src.isConnected){a=stageRectOf(src);}
  P.classList.remove('show');
  const fx=891, fy=18, fw=774, fh=1143;
  const kf=a?[{transform:'none'},{transform:'translate('+(a.x-fx)+'px,'+(a.y-fy)+'px) scale('+(a.w/fw)+','+(a.h/fh)+')'}]:[{transform:'none',opacity:1},{transform:'scale(.85)',opacity:0}];
  const an=wrap.animate(kf,{duration:300,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});
  try{ await Promise.race([an.finished,sleep(450)]); }catch(_){ await sleep(300); }
  P.classList.remove('on'); try{an.cancel();}catch(_){} pop=null; flipping=false; g=null; suppressUp=null; stopMotion();
}
async function flipCard(){
  if(!pop||pop.closing||flipping) return; flipping=true;
  const to=!pop.flipped; pop.flipped=to;
  document.querySelectorAll('#popup .sweep i').forEach(i=>i.animate([{transform:'translateX(0) skewX(-14deg)',opacity:0},{opacity:.95,offset:.45},{transform:'translateX(420%) skewX(-14deg)',opacity:0}],{duration:650,easing:'ease-in-out'}));
  await animate(to?0:180,to?180:0,650,easeOut,setFlipAngle);
  setFlipAngle(to?180:0); flipping=false;
}
$('#popup').addEventListener('pointermove',e=>{ if(pop&&!pop.closing) popLight(e); });
$('#popup').addEventListener('pointerup',e=>{
  if(suppressUp===e.pointerId){suppressUp=null; return;}
  if(!pop||pop.closing) return;
  if(performance.now()-pop.t0<450) return;
  if(e.target.closest('#pwrap')) flipCard(); else closePopup();
});
$('#popup').addEventListener('pointercancel',e=>{ if(suppressUp===e.pointerId)suppressUp=null; });
/* device tilt */
let motionOn=false, motionAsked=false, base=null;
function onTilt(ev){
  if(!pop||pop.closing||ev.beta==null) return;
  const ang=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(typeof window.orientation==='number'?window.orientation:90);
  const land=Math.abs(ang)===90||ang===270;
  const a=land?ev.beta:ev.gamma, b=land?ev.gamma:ev.beta, sgn=(ang===90||ang===-90&&false)?1:(ang===270||ang===-90?-1:1);
  if(!base) base={a:a,b:b};
  const dx=clamp((a-base.a)*sgn/34,-.5,.5), dy=clamp((b-base.b)*sgn*-1/34,-.5,.5);
  setLight(.5+dx,.5+dy);
}
function startMotion(){ base=null; }
function stopMotion(){ base=null; }
function askMotion(){
  if(motionAsked) return; motionAsked=true;
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(r=>{ if(r==='granted'){motionOn=true; window.addEventListener('deviceorientation',onTilt);} }).catch(()=>{});
    }else if(typeof DeviceOrientationEvent!=='undefined'){ motionOn=true; window.addEventListener('deviceorientation',onTilt); }
  }catch(_){}
}

/* ---------- cover tap / keyboard ---------- */
stage.addEventListener('click',e=>{
  if(state==='closed'){ e.stopPropagation(); e.preventDefault(); unlockAudio(); askMotion(); openCover(); }
},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(pop) closePopup(); else if(!$('#sheet').hidden) hideSheet(); else if(cutState) closeCut(); else if(uiLayer==='storage') closeStorage(); else if(uiLayer==='create') closeCreate(); else if(placing){placing=null; renderBases();}
  }
  if(state==='open'&&!uiBlocked()){ if(e.key==='ArrowRight') goTo(cur+1); if(e.key==='ArrowLeft') goTo(cur-1); }
});

/* ---------- init ---------- */
async function init(){
  fit(); ringsSvg(); buildTabs(); buildBars();
  loadState(); computeSpreads();
  await DB.init();
  try{
    const recs=await DB.allCards();
    await Promise.all(recs.filter(r=>r&&r.front).map(async r=>{
      try{ const url=(typeof r.front==='string')?r.front:await blobToDataURL(r.front); cards.set(r.id,Object.assign({},r,{url:url})); }
      catch(_){ loadFailed=true; }
    }));
  }catch(_){}
  if(!loadFailed){ pruneState(); save(); }
  computeSpreads();
  showClosed(); syncCreate(); warmBacks();
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(_){}
  if(!DB.persistent) setTimeout(()=>toast('이 브라우저에서는 카드가 저장되지 않을 수 있어요'),1200);
  fit();
}
window.IB={cut:()=>cutState&&{start:cutState.start,win:cutState.win,total:cutState.total,playing:!!cutState.node},closePopup:closePopup,flip:flipCard,audio:()=>({playing:playing,ctx:actx&&actx.state}),S:()=>S,cards:cards,demo:async()=>{for(const m of MEMBERS)await makeDemo(m); },go:goTo,open:openCover,state:()=>state,render:renderBases,openCreate:openCreate,openStorage:openStorage,closeStorage:closeStorage,place:place,computeSpreads:computeSpreads,cur:()=>cur,fit:fit};
init();
})();
</script>
